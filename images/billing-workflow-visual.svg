<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wfTitle">
  <title id="wfTitle">The claim lifecycle from eligibility check through payment posting, with denial management running alongside</title>
  <defs>
    <linearGradient id="wfBg" x1="180" y1="80" x2="1000" y2="1120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
    <filter id="wfShadow" x="110" y="100" width="980" height="1000" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" rx="120" fill="url(#wfBg)"/>
  <circle cx="196" cy="216" r="104" fill="#DBEAFE"/>
  <circle cx="1018" cy="978" r="140" fill="#BFDBFE" fill-opacity="0.55"/>

  <g filter="url(#wfShadow)">
    <rect x="170" y="150" width="860" height="900" rx="64" fill="white"/>
    <rect x="170" y="150" width="860" height="900" rx="64" stroke="#E1EAF8" stroke-width="2"/>
  </g>

  <text x="230" y="248" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="34" font-weight="700">Claim lifecycle</text>
  <text x="230" y="284" fill="#64748B" font-family="'Inter', Arial, sans-serif" font-size="22">Registration through posted payment, every claim tracked</text>

  <!-- connecting spine -->
  <line x1="271" y1="356" x2="271" y2="984" stroke="#DCE7FB" stroke-width="3"/>

  <g font-family="'Outfit', Arial, sans-serif">
    <!-- 1 -->
    <circle cx="271" cy="356" r="24" fill="#EEF4FF" stroke="#BFD7FB" stroke-width="2"/>
    <text x="271" y="363" text-anchor="middle" fill="#1D4ED8" font-size="20" font-weight="700">1</text>
    <text x="322" y="350" fill="#0F172A" font-size="22" font-weight="700">Eligibility check</text>
    <text x="322" y="376" fill="#64748B" font-family="'Inter', Arial, sans-serif" font-size="18">Coverage verified before the patient arrives</text>

    <!-- 2 -->
    <circle cx="271" cy="472" r="24" fill="#EEF4FF" stroke="#BFD7FB" stroke-width="2"/>
    <text x="271" y="479" text-anchor="middle" fill="#1D4ED8" font-size="20" font-weight="700">2</text>
    <text x="322" y="466" fill="#0F172A" font-size="22" font-weight="700">Charge capture &amp; coding</text>
    <text x="322" y="492" fill="#64748B" font-family="'Inter', Arial, sans-serif" font-size="18">Diagnosis and procedure codes captured</text>

    <!-- 3 -->
    <circle cx="271" cy="588" r="24" fill="#EEF4FF" stroke="#BFD7FB" stroke-width="2"/>
    <text x="271" y="595" text-anchor="middle" fill="#1D4ED8" font-size="20" font-weight="700">3</text>
    <text x="322" y="582" fill="#0F172A" font-size="22" font-weight="700">Claim scrubbing &amp; submission</text>
    <text x="322" y="608" fill="#64748B" font-family="'Inter', Arial, sans-serif" font-size="18">Checked against payer rules, then filed electronically</text>

    <!-- 4 -->
    <circle cx="271" cy="704" r="24" fill="#EEF4FF" stroke="#BFD7FB" stroke-width="2"/>
    <text x="271" y="711" text-anchor="middle" fill="#1D4ED8" font-size="20" font-weight="700">4</text>
    <text x="322" y="698" fill="#0F172A" font-size="22" font-weight="700">Payer adjudication</text>
    <text x="322" y="724" fill="#64748B" font-family="'Inter', Arial, sans-serif" font-size="18">Reviewed by the payer against the claim</text>

    <!-- 5 -->
    <circle cx="271" cy="820" r="24" fill="url(#wfBg)" stroke="#2F6FED" stroke-width="2"/>
    <path d="M262 820l6 6 12-13" stroke="#2F6FED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="322" y="814" fill="#0F172A" font-size="22" font-weight="700">Payment posted</text>
    <text x="322" y="840" fill="#64748B" font-family="'Inter', Arial, sans-serif" font-size="18">Reimbursement reconciled to the account</text>

    <!-- 6, branch -->
    <circle cx="271" cy="936" r="24" fill="#FFF6E8" stroke="#F5C77E" stroke-width="2"/>
    <path d="M264 928l14 16M278 928l-14 16" stroke="#EA7A2C" stroke-width="3" stroke-linecap="round"/>
    <text x="322" y="930" fill="#0F172A" font-size="22" font-weight="700">Denial management</text>
    <text x="322" y="956" fill="#64748B" font-family="'Inter', Arial, sans-serif" font-size="18">Tracked, appealed, and resubmitted fast when it happens</text>
  </g>

  <text x="600" y="1032" text-anchor="middle" fill="#94A3B8" font-family="'Inter', Arial, sans-serif" font-size="23" font-weight="500">Every claim visible at every stage, not just at the end</text>
</svg>
