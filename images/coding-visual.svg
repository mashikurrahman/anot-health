<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="codeTitle">
  <title id="codeTitle">A clinical note being matched to specific diagnosis and procedure codes, then flagged as reviewed</title>
  <defs>
    <linearGradient id="codeBg" x1="180" y1="80" x2="1000" y2="1120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
    <linearGradient id="codeAccent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2F6FED"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="codeShadow" x="110" y="100" width="980" height="1000" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="codeChipShadow" x="-20%" y="-30%" width="140%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" rx="120" fill="url(#codeBg)"/>
  <circle cx="196" cy="216" r="104" fill="#DBEAFE"/>
  <circle cx="1018" cy="978" r="140" fill="#BFDBFE" fill-opacity="0.55"/>

  <g filter="url(#codeShadow)">
    <rect x="170" y="150" width="860" height="900" rx="64" fill="white"/>
    <rect x="170" y="150" width="860" height="900" rx="64" stroke="#E1EAF8" stroke-width="2"/>
  </g>

  <text x="230" y="248" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="34" font-weight="700">Note to code</text>
  <text x="230" y="284" fill="#64748B" font-family="'Inter', Arial, sans-serif" font-size="22">Documentation matched to specific, defensible codes</text>

  <!-- Left: clinical note -->
  <rect x="230" y="340" width="270" height="360" rx="28" fill="#F8FAFC" stroke="#E2E8F0"/>
  <circle cx="270" cy="380" r="10" fill="#CBD5E1"/>
  <text x="292" y="386" fill="#64748B" font-family="'Outfit', Arial, sans-serif" font-size="19" font-weight="600">Clinical Note</text>
  <rect x="256" y="416" width="150" height="14" rx="7" fill="#CBD5E1"/>
  <rect x="256" y="448" width="216" height="12" rx="6" fill="#E2E8F0"/>
  <rect x="256" y="472" width="196" height="12" rx="6" fill="#E2E8F0"/>
  <rect x="256" y="496" width="210" height="12" rx="6" fill="#E2E8F0"/>
  <rect x="256" y="530" width="120" height="14" rx="7" fill="#CBD5E1"/>
  <rect x="256" y="562" width="200" height="12" rx="6" fill="#E2E8F0"/>
  <rect x="256" y="586" width="180" height="12" rx="6" fill="#E2E8F0"/>
  <rect x="256" y="610" width="204" height="12" rx="6" fill="#E2E8F0"/>
  <rect x="256" y="644" width="140" height="14" rx="7" fill="#CBD5E1"/>
  <rect x="256" y="676" width="188" height="12" rx="6" fill="#E2E8F0"/>

  <!-- Middle: transform arrow -->
  <g>
    <circle cx="562" cy="520" r="34" fill="url(#codeAccent)"/>
    <path d="M548 520h28M566 508l12 12-12 12" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Right: code chips -->
  <g filter="url(#codeChipShadow)">
    <rect x="624" y="352" width="176" height="66" rx="20" fill="#EAF2FE" stroke="#BFD7FB" stroke-width="2"/>
  </g>
  <text x="646" y="393" fill="#1D4ED8" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="26" font-weight="700">E11.9</text>
  <circle cx="774" cy="385" r="14" fill="#EAF7EE"/>
  <path d="M768 385l4 4 8-9" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <g filter="url(#codeChipShadow)">
    <rect x="624" y="440" width="176" height="66" rx="20" fill="#EAF2FE" stroke="#BFD7FB" stroke-width="2"/>
  </g>
  <text x="646" y="481" fill="#1D4ED8" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="26" font-weight="700">99214</text>
  <circle cx="774" cy="473" r="14" fill="#EAF7EE"/>
  <path d="M768 473l4 4 8-9" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <g filter="url(#codeChipShadow)">
    <rect x="624" y="528" width="176" height="66" rx="20" fill="#EAF2FE" stroke="#BFD7FB" stroke-width="2"/>
  </g>
  <text x="646" y="569" fill="#1D4ED8" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="26" font-weight="700">J45.40</text>
  <circle cx="774" cy="561" r="14" fill="#EAF7EE"/>
  <path d="M768 561l4 4 8-9" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <g filter="url(#codeChipShadow)">
    <rect x="624" y="616" width="140" height="66" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-dasharray="5 6"/>
  </g>
  <text x="646" y="657" fill="#94A3B8" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="24" font-weight="600">+more</text>

  <!-- bottom band: what gets checked -->
  <rect x="230" y="742" width="740" height="176" rx="30" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="266" y="792" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="23" font-weight="700">Reviewed before it ever reaches a claim</text>
  <g fill="#334155" font-family="'Inter', Arial, sans-serif" font-size="19">
    <circle cx="276" cy="826" r="4" fill="#2F6FED"/>
    <text x="292" y="832">Specificity and modifier logic checked against the note</text>
    <circle cx="276" cy="858" r="4" fill="#2F6FED"/>
    <text x="292" y="864">Medical necessity and documentation support verified</text>
    <circle cx="276" cy="890" r="4" fill="#2F6FED"/>
    <text x="292" y="896">Coder sign-off before codes leave for billing</text>
  </g>

  <text x="600" y="1032" text-anchor="middle" fill="#94A3B8" font-family="'Inter', Arial, sans-serif" font-size="23" font-weight="500">Certified coders review every chart, every code</text>
</svg>
