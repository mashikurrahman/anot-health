<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="payTitle">
  <title id="payTitle">A scheduled payroll run disbursing accurate pay to multiple providers on the same day</title>
  <defs>
    <linearGradient id="payBg" x1="180" y1="80" x2="1000" y2="1120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
    <linearGradient id="payAccent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2F6FED"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="payShadow" x="110" y="100" width="980" height="1000" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="payRowShadow" x="-6%" y="-30%" width="112%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" rx="120" fill="url(#payBg)"/>
  <circle cx="196" cy="216" r="104" fill="#DBEAFE"/>
  <circle cx="1018" cy="978" r="140" fill="#BFDBFE" fill-opacity="0.55"/>

  <g filter="url(#payShadow)">
    <rect x="170" y="150" width="860" height="900" rx="64" fill="white"/>
    <rect x="170" y="150" width="860" height="900" rx="64" stroke="#E1EAF8" stroke-width="2"/>
  </g>

  <!-- Header: pay run card -->
  <rect x="230" y="210" width="740" height="150" rx="30" fill="url(#payAccent)"/>
  <circle cx="300" cy="285" r="34" fill="rgba(255,255,255,0.14)"/>
  <rect x="286" y="270" width="28" height="24" rx="4" fill="none" stroke="white" stroke-width="3"/>
  <path d="M286 278h28" stroke="white" stroke-width="3"/>
  <path d="M293 264v10M307 264v10" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <text x="352" y="272" fill="white" font-family="'Outfit', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="1.5" opacity="0.75">NEXT PAY RUN</text>
  <text x="352" y="308" fill="white" font-family="'Outfit', Arial, sans-serif" font-size="30" font-weight="700">Friday &#183; Direct deposit</text>
  <text x="838" y="272" fill="white" font-family="'Inter', Arial, sans-serif" font-size="17" opacity="0.75" text-anchor="end">STATUS</text>
  <g transform="translate(802,282)">
    <rect width="132" height="40" rx="20" fill="rgba(255,255,255,0.16)"/>
    <circle cx="22" cy="20" r="6" fill="#4ADE80"/>
    <text x="38" y="26" fill="white" font-family="'Inter', Arial, sans-serif" font-size="18" font-weight="600">On schedule</text>
  </g>

  <!-- Provider payment rows -->
  <g font-family="'Inter', Arial, sans-serif">
    <g filter="url(#payRowShadow)">
      <rect x="230" y="398" width="740" height="92" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
    </g>
    <circle cx="284" cy="444" r="24" fill="#EEF4FF"/>
    <text x="284" y="451" fill="#2F6FED" font-family="'Outfit', Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">DR</text>
    <text x="330" y="435" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="21" font-weight="600">Dr. R. Alvarez</text>
    <text x="330" y="459" fill="#64748B" font-size="17">Internal Medicine &#183; salaried</text>
    <text x="870" y="450" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="24" font-weight="700" text-anchor="end">$8,240.00</text>

    <g filter="url(#payRowShadow)">
      <rect x="230" y="502" width="740" height="92" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
    </g>
    <circle cx="284" cy="548" r="24" fill="#FDF0E7"/>
    <text x="284" y="555" fill="#EA7A2C" font-family="'Outfit', Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">NP</text>
    <text x="330" y="539" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="21" font-weight="600">J. Coleman, NP</text>
    <text x="330" y="563" fill="#64748B" font-size="17">Urgent Care &#183; hourly + differential</text>
    <text x="870" y="554" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="24" font-weight="700" text-anchor="end">$3,915.60</text>

    <g filter="url(#payRowShadow)">
      <rect x="230" y="606" width="740" height="92" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
    </g>
    <circle cx="284" cy="652" r="24" fill="#F0EAFD"/>
    <text x="284" y="659" fill="#7C3AED" font-family="'Outfit', Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">PA</text>
    <text x="330" y="643" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="21" font-weight="600">M. Osei, PA-C</text>
    <text x="330" y="667" fill="#64748B" font-size="17">Orthopedics &#183; production bonus included</text>
    <text x="870" y="662" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="24" font-weight="700" text-anchor="end">$6,128.40</text>
  </g>

  <!-- summary strip -->
  <rect x="230" y="742" width="740" height="176" rx="30" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="266" y="794" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="23" font-weight="700">Checked before it leaves the account</text>
  <g fill="#334155" font-family="'Inter', Arial, sans-serif" font-size="19">
    <circle cx="276" cy="828" r="4" fill="#2F6FED"/>
    <text x="292" y="834">Hours, bonuses, and differentials reconciled against the schedule</text>
    <circle cx="276" cy="860" r="4" fill="#2F6FED"/>
    <text x="292" y="866">Withholding and deductions calculated per provider</text>
    <circle cx="276" cy="892" r="4" fill="#2F6FED"/>
    <text x="292" y="898">Funded and confirmed the same day, every pay period</text>
  </g>

  <text x="600" y="1032" text-anchor="middle" fill="#94A3B8" font-family="'Inter', Arial, sans-serif" font-size="23" font-weight="500">Accurate provider pay, on the same schedule every time</text>
</svg>
