<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="specTitle">
  <title id="specTitle">Anot Health covers 50+ medical specialties, radiating out to primary care, cardiology, orthopedics, urgent care, behavioral health, and general surgery</title>
  <defs>
    <linearGradient id="specBg" x1="180" y1="80" x2="1000" y2="1120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
    <linearGradient id="specCenter" x1="420" y1="380" x2="790" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F6FED"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="specShadow" x="110" y="100" width="980" height="1000" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pillShadow" x="-20" y="-14" width="140" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" rx="120" fill="url(#specBg)"/>
  <circle cx="200" cy="210" r="104" fill="#DBEAFE"/>
  <circle cx="1016" cy="972" r="140" fill="#BFDBFE" fill-opacity="0.55"/>

  <g filter="url(#specShadow)">
    <rect x="170" y="150" width="860" height="900" rx="64" fill="white"/>
    <rect x="170" y="150" width="860" height="900" rx="64" stroke="#E1EAF8" stroke-width="2"/>
  </g>

  <!-- spokes, drawn under everything else -->
  <g stroke="#BFD7FB" stroke-width="4" stroke-linecap="round">
    <path d="M600 351V300"/>
    <path d="M796 448L840 419"/>
    <path d="M812 706L855 733"/>
    <path d="M600 815V872"/>
    <path d="M388 706L345 733"/>
    <path d="M404 448L360 419"/>
  </g>
  <g fill="#8FB8F6">
    <circle cx="600" cy="351" r="6"/>
    <circle cx="796" cy="448" r="6"/>
    <circle cx="812" cy="706" r="6"/>
    <circle cx="600" cy="815" r="6"/>
    <circle cx="388" cy="706" r="6"/>
    <circle cx="404" cy="448" r="6"/>
  </g>

  <!-- center hub -->
  <circle cx="600" cy="583" r="252" fill="none" stroke="#CFE1FC" stroke-width="2" stroke-dasharray="2 16" stroke-linecap="round"/>
  <circle cx="600" cy="583" r="212" fill="url(#specCenter)"/>
  <text x="600" y="560" text-anchor="middle" fill="white" font-family="'Outfit', Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="2" opacity="0.88">SPECIALTIES</text>
  <text x="600" y="632" text-anchor="middle" fill="white" font-family="'Outfit', Arial, sans-serif" font-size="92" font-weight="700">50+</text>
  <text x="600" y="686" text-anchor="middle" fill="#CFE0FE" font-family="'Inter', Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="0.3">Trained &#183; Reviewed &#183; Coded</text>

  <!-- Primary Care (top) -->
  <g filter="url(#pillShadow)">
    <rect x="473" y="196" width="254" height="86" rx="24" fill="white" stroke="#E7EEFA"/>
  </g>
  <circle cx="511" cy="239" r="20" fill="#EEF4FF"/>
  <path d="M511 229V249M501 239H521" stroke="#2F6FED" stroke-width="4.5" stroke-linecap="round"/>
  <text x="543" y="245" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="25" font-weight="600">Primary Care</text>

  <!-- Cardiology (upper right) -->
  <g filter="url(#pillShadow)">
    <rect x="790" y="332" width="228" height="86" rx="24" fill="white" stroke="#E7EEFA"/>
  </g>
  <circle cx="828" cy="375" r="20" fill="#FEECEC"/>
  <path d="M828 386c-11-7-17-14-17-21a9 9 0 0 1 17-4 9 9 0 0 1 17 4c0 7-6 14-17 21z" fill="#EF4444"/>
  <text x="860" y="381" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="25" font-weight="600">Cardiology</text>

  <!-- General Surgery (lower right) -->
  <g filter="url(#pillShadow)">
    <rect x="816" y="662" width="200" height="86" rx="24" fill="white" stroke="#E7EEFA"/>
  </g>
  <circle cx="854" cy="705" r="20" fill="#EAF7EE"/>
  <circle cx="854" cy="705" r="11" fill="none" stroke="#16A34A" stroke-width="3.5"/>
  <circle cx="854" cy="705" r="3" fill="#16A34A"/>
  <text x="886" y="711" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="25" font-weight="600">Surgery</text>

  <!-- Behavioral Health (bottom) -->
  <g filter="url(#pillShadow)">
    <rect x="487" y="828" width="226" height="86" rx="24" fill="white" stroke="#E7EEFA"/>
  </g>
  <circle cx="525" cy="871" r="20" fill="#F3EEFE"/>
  <path d="M513 871h6l4-9 5 16 4-11 3 4h6" fill="none" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="557" y="877" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="25" font-weight="600">Behavioral</text>

  <!-- Orthopedics (lower left) -->
  <g filter="url(#pillShadow)">
    <rect x="186" y="662" width="244" height="86" rx="24" fill="white" stroke="#E7EEFA"/>
  </g>
  <circle cx="224" cy="705" r="20" fill="#FFF4E8"/>
  <g transform="translate(224 705) rotate(-45)">
    <rect x="-9" y="-2.4" width="18" height="4.8" rx="2.4" fill="#F59E0B"/>
    <circle cx="-9" cy="-3.4" r="3.2" fill="#F59E0B"/>
    <circle cx="-9" cy="3.4" r="3.2" fill="#F59E0B"/>
    <circle cx="9" cy="-3.4" r="3.2" fill="#F59E0B"/>
    <circle cx="9" cy="3.4" r="3.2" fill="#F59E0B"/>
  </g>
  <text x="256" y="711" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="25" font-weight="600">Orthopedics</text>

  <!-- Urgent Care (upper left) -->
  <g filter="url(#pillShadow)">
    <rect x="186" y="332" width="240" height="86" rx="24" fill="white" stroke="#E7EEFA"/>
  </g>
  <circle cx="224" cy="375" r="20" fill="#EAF6FE"/>
  <path d="M227 363l-12 15h9l-3 12 13-16h-9z" fill="#0EA5E9"/>
  <text x="256" y="381" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="25" font-weight="600">Urgent Care</text>

  <!-- footer caption, replacing the old placeholder bars -->
  <text x="600" y="1032" text-anchor="middle" fill="#94A3B8" font-family="'Inter', Arial, sans-serif" font-size="23" font-weight="500">and 44 more specialty workflows, each with its own coding logic</text>
</svg>
