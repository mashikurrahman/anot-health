<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="emrTitle">
  <title id="emrTitle">A visit conversation drafted into a note by a certified scribe, verified by a QPS auditor, and delivered as a sign-ready encounter note inside the EMR</title>
  <defs>
    <linearGradient id="emrBg" x1="180" y1="80" x2="1000" y2="1120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
    <linearGradient id="emrAccent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2F6FED"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="emrShadow" x="100" y="100" width="1000" height="1040" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="emrRowShadow" x="-10%" y="-30%" width="120%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" rx="120" fill="url(#emrBg)"/>
  <circle cx="104" cy="124" r="132" fill="#DBEAFE"/>
  <circle cx="1106" cy="1086" r="152" fill="#BFDBFE" fill-opacity="0.55"/>

  <!-- The card is laid out on 860x860 (x170..1030, y150..1010) and scaled 1.25x so the artwork fills the canvas -->
  <g transform="translate(600 600) scale(1.25) translate(-600 -580)">
    <g filter="url(#emrShadow)">
      <rect x="170" y="150" width="860" height="860" rx="64" fill="white"/>
      <rect x="170" y="150" width="860" height="860" rx="64" stroke="#E1EAF8" stroke-width="2"/>
    </g>

    <text x="230" y="248" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="34" font-weight="700">Note to chart</text>
    <text x="230" y="284" fill="#64748B" font-family="'Inter', Arial, sans-serif" font-size="22">Verified notes delivered straight into your EMR</text>

    <!-- Left: the visit conversation -->
    <rect x="230" y="340" width="270" height="360" rx="28" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="270" cy="380" r="10" fill="#93B4F5"/>
    <text x="292" y="386" fill="#64748B" font-family="'Outfit', Arial, sans-serif" font-size="19" font-weight="600">Ambient visit</text>

    <rect x="256" y="416" width="196" height="72" rx="20" fill="#EAF2FE" stroke="#BFD7FB"/>
    <rect x="278" y="438" width="140" height="10" rx="5" fill="#BFD7FB"/>
    <rect x="278" y="458" width="98" height="10" rx="5" fill="#BFD7FB"/>

    <rect x="278" y="504" width="196" height="72" rx="20" fill="white" stroke="#E2E8F0"/>
    <rect x="300" y="526" width="150" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="300" y="546" width="110" height="10" rx="5" fill="#E2E8F0"/>

    <rect x="256" y="592" width="196" height="72" rx="20" fill="#EAF2FE" stroke="#BFD7FB"/>
    <rect x="278" y="614" width="128" height="10" rx="5" fill="#BFD7FB"/>
    <rect x="278" y="634" width="150" height="10" rx="5" fill="#BFD7FB"/>

    <!-- Middle: human review, then hand-off -->
    <circle cx="562" cy="492" r="34" fill="url(#emrAccent)"/>
    <path d="M548 492h28M566 480l12 12-12 12" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="512" y="546" width="100" height="32" rx="16" fill="#EAF7EE"/>
    <path d="M528 562l4 4 8-9" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="547" y="568" fill="#15803D" font-family="'Inter', Arial, sans-serif" font-size="16" font-weight="600">Verified</text>

    <!-- Right: the EMR encounter note -->
    <rect x="624" y="340" width="346" height="360" rx="28" fill="#F5F9FF" stroke="#BFD7FB" stroke-width="2"/>
    <circle cx="662" cy="380" r="10" fill="#2F6FED"/>
    <text x="684" y="386" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="19" font-weight="600">Encounter note</text>
    <rect x="838" y="363" width="112" height="32" rx="16" fill="#EAF7EE"/>
    <text x="894" y="384" text-anchor="middle" fill="#15803D" font-family="'Inter', Arial, sans-serif" font-size="16" font-weight="600">Sign-ready</text>

    <g filter="url(#emrRowShadow)">
      <rect x="648" y="418" width="298" height="56" rx="16" fill="white" stroke="#E2E8F0"/>
      <rect x="648" y="484" width="298" height="56" rx="16" fill="white" stroke="#E2E8F0"/>
      <rect x="648" y="550" width="298" height="56" rx="16" fill="white" stroke="#E2E8F0"/>
      <rect x="648" y="616" width="298" height="56" rx="16" fill="white" stroke="#E2E8F0"/>
    </g>

    <g font-family="'Outfit', Arial, sans-serif" font-size="17" font-weight="700" fill="#1D4ED8" text-anchor="middle">
      <circle cx="680" cy="446" r="16" fill="#EEF4FF" stroke="#BFD7FB" stroke-width="2"/>
      <text x="680" y="452">S</text>
      <circle cx="680" cy="512" r="16" fill="#EEF4FF" stroke="#BFD7FB" stroke-width="2"/>
      <text x="680" y="518">O</text>
      <circle cx="680" cy="578" r="16" fill="#EEF4FF" stroke="#BFD7FB" stroke-width="2"/>
      <text x="680" y="584">A</text>
      <circle cx="680" cy="644" r="16" fill="#EEF4FF" stroke="#BFD7FB" stroke-width="2"/>
      <text x="680" y="650">P</text>
    </g>

    <g fill="#0F172A" font-family="'Inter', Arial, sans-serif" font-size="19" font-weight="600">
      <text x="710" y="443">Subjective</text>
      <text x="710" y="509">Objective</text>
      <text x="710" y="575">Assessment</text>
      <text x="710" y="641">Plan</text>
    </g>
    <rect x="710" y="452" width="124" height="9" rx="4.5" fill="#E2E8F0"/>
    <rect x="710" y="518" width="104" height="9" rx="4.5" fill="#E2E8F0"/>
    <rect x="710" y="584" width="136" height="9" rx="4.5" fill="#E2E8F0"/>
    <rect x="710" y="650" width="96" height="9" rx="4.5" fill="#E2E8F0"/>

    <g stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="918" cy="446" r="14" fill="#EAF7EE" stroke="none"/>
      <path d="M912 446l4 4 8-9"/>
      <circle cx="918" cy="512" r="14" fill="#EAF7EE" stroke="none"/>
      <path d="M912 512l4 4 8-9"/>
      <circle cx="918" cy="578" r="14" fill="#EAF7EE" stroke="none"/>
      <path d="M912 578l4 4 8-9"/>
      <circle cx="918" cy="644" r="14" fill="#EAF7EE" stroke="none"/>
      <path d="M912 644l4 4 8-9"/>
    </g>

    <!-- Bottom band: what happens before it lands -->
    <rect x="230" y="742" width="740" height="176" rx="30" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="266" y="792" fill="#0F172A" font-family="'Outfit', Arial, sans-serif" font-size="25" font-weight="700">Reviewed by people before it reaches your chart</text>
    <g fill="#334155" font-family="'Inter', Arial, sans-serif" font-size="21.5">
      <circle cx="276" cy="826" r="4" fill="#2F6FED"/>
      <text x="292" y="832">Drafted by a certified scribe from the visit</text>
      <circle cx="276" cy="858" r="4" fill="#2F6FED"/>
      <text x="292" y="864">Meds, doses, and referrals verified by a QPS auditor</text>
      <circle cx="276" cy="890" r="4" fill="#2F6FED"/>
      <text x="292" y="896">Placed in your clinic's own EMR template, ready to sign</text>
    </g>

    <text x="600" y="976" text-anchor="middle" fill="#94A3B8" font-family="'Inter', Arial, sans-serif" font-size="24" font-weight="500">Delivered inside your EMR, not in a separate window</text>
  </g>
</svg>
